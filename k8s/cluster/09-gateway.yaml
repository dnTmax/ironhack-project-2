apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: voting-gateway
  namespace: voting-app
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: nginx
  infrastructure:
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      port: 443
      protocol: HTTPS
      hostname: dnt-voting.ironlabs.online
      tls:
        mode: Terminate
        certificateRefs:
          - name: voting-tls
      allowedRoutes:
        namespaces:
          from: Same
