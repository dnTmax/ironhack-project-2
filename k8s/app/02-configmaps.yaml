apiVersion: v1
kind: ConfigMap
metadata:
  name: vote-config
  namespace: voting-app
data:
  REDIS_HOST: redis
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: result-config
  namespace: voting-app
data:
  PG_HOST: postgres
  PG_PORT: "5432"
  PG_USER: postgres
  PG_DATABASE: postgres
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-config
  namespace: voting-app
data:
  DB_HOST: postgres
  DB_USERNAME: postgres
  DB_NAME: postgres
  REDIS_HOST: redis
