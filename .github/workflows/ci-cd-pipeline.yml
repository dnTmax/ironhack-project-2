name: CI/CD voting app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-voting-app
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: dnt-project-2

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [vote, result, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/voteapp2-${{ matrix.service }}:${{ github.sha }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Connect kubectl to the cluster
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"
      - name: Point manifests to the new images
        env:
          REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          for svc in vote result worker; do
            sed -i "s|image: .*/${svc}:.*|image: ${REGISTRY}/voteapp2-${svc}:${GITHUB_SHA}|" k8s/app/*-${svc}.yaml
          done
          grep -n "image:" k8s/app/*.yaml
      - name: Apply manifests
        run: kubectl apply -f k8s/app/
      - name: Wait for the rollout
        run: |
          kubectl rollout status deployment/vote -n voting-app --timeout=180s
          kubectl rollout status deployment/result -n voting-app --timeout=180s
          kubectl rollout status deployment/worker -n voting-app --timeout=180s
          kubectl get pods -n voting-app
