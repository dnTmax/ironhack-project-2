name: OIDC debug

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    env:
      ROLE: ${{ secrets.AWS_ROLE_ARN }}
    steps:
      - name: Check the role secret (value is not printed)
        run: |
          echo "longueur du secret : ${#ROLE}"
          case "$ROLE" in
            arn:aws:iam::*:role/dnt-project-2-github-deploy) echo "forme : ok" ;;
            *) echo "forme : DIFFERENTE" ;;
          esac
      - name: Show OIDC claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::$TOKEN"
          echo "$TOKEN" | python3 -c "import sys,json,base64; p=sys.stdin.read().strip().split('.')[1]; p+='='*(-len(p)%4); d=json.loads(base64.urlsafe_b64decode(p)); print({k:d.get(k) for k in ('sub','aud','repository','ref','iss')})"
