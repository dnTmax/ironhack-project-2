apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: dnt-project-2
  region: us-east-1
  tags:
    owner: dnt
    project: dnt-ironhack-project-2

availabilityZones: ["us-east-1a", "us-east-1b"]

iam:
  withOIDC: true

managedNodeGroups:
  - name: ng-main
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 3
    volumeSize: 20

addons:
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true
  - name: metrics-server
